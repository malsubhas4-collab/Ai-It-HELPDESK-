<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI IT Helpdesk | Smart IT Support</title>
<style>
:root{--bg:#08111f;--panel:#101d30;--panel2:#14243a;--line:#233750;--text:#eaf2ff;--muted:#9db0c9;--blue:#4f9cff;--cyan:#35d4df;--green:#39d98a;--yellow:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#142d4b 0,transparent 32%),var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:#0a1525;border-right:1px solid var(--line);padding:25px 17px;position:fixed;inset:0 auto 0 0}
.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:18px;margin:0 8px 35px}.logo{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:#08111f;display:grid;place-items:center;overflow:hidden;border:1px solid #244564;box-shadow:0 0 14px rgba(53,212,223,.18)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.4px;margin-top:3px}
.nav-label{color:#7086a2;font-size:10px;letter-spacing:1.6px;margin:20px 10px 9px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:10px;background:transparent;color:#aebed2;text-align:left;font-size:14px;cursor:pointer;margin:4px 0}.nav button.active,.nav button:hover{background:#172b44;color:white}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}
.side-note{position:absolute;bottom:22px;left:18px;right:18px;background:#11253b;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:11px;color:var(--muted);line-height:1.6}
main{margin-left:245px;width:calc(100% - 245px);padding:28px 34px 50px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;font-weight:700}.topbar h1{font-size:25px;margin:7px 0 0}.profile{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:12px;color:var(--muted);font-size:12px}
.page{display:none}.page.active{display:block}.welcome{padding:27px;border:1px solid #244564;border-radius:18px;background:linear-gradient(110deg,#123050,#10243a 62%,#113e50);display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.welcome h2{font-size:24px;margin:8px 0}.welcome p{color:#bfd0e5;margin:0;max-width:610px;line-height:1.6;font-size:14px}.welcome .art{font-size:62px;opacity:.9}.btn{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#061321;font-weight:800;cursor:pointer}.btn.secondary{background:#1a3049;color:var(--text);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-value{font-size:27px;font-weight:800;margin:13px 0 4px}.stat-foot{font-size:11px;color:#7f96b2}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.section-title{font-size:16px;margin:0 0 15px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px;text-align:left;color:var(--text);cursor:pointer}.quick button:hover{border-color:var(--cyan)}.quick strong{display:block;margin:6px 0;font-size:13px}.quick span{font-size:11px;color:var(--muted)}.status-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.status-row:last-child{border:0}.pill{border-radius:30px;padding:4px 9px;font-size:10px;background:#123c36;color:var(--green)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:17px}.panel p{color:var(--muted);font-size:13px;line-height:1.6}.field{width:100%;background:#091626;border:1px solid #29405c;border-radius:9px;padding:12px;color:var(--text);outline:none;margin:7px 0 13px}.field:focus{border-color:var(--cyan)}label{font-size:12px;color:#b6c7dc}.chatbox{height:310px;overflow:auto;background:#091626;border:1px solid var(--line);border-radius:11px;padding:14px;margin:15px 0}.msg{max-width:85%;padding:11px 13px;border-radius:12px;margin:9px 0;font-size:13px;line-height:1.55;white-space:pre-wrap}.bot{background:#172c45;border:1px solid #29435f}.user{background:#14506a;margin-left:auto}.chat-input{display:flex;gap:8px}.chat-input input{flex:1;margin:0}.meter{height:9px;background:#20334b;border-radius:10px;overflow:hidden;margin:8px 0 17px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0%}.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.ticket{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px}.ticket small{display:block;color:var(--muted);margin-top:5px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.notice{font-size:11px;color:var(--muted);margin-top:13px;line-height:1.5}
@media(max-width:850px){.sidebar{width:68px;padding:17px 8px}.brand{margin:0 6px 30px}.brand div:last-child,.nav-label,.nav button span,.side-note{display:none}.nav button{justify-content:center;font-size:18px;padding:13px 5px}.layout main{margin-left:68px;width:calc(100% - 68px);padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.welcome .art{display:none}}
@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}.topbar h1{font-size:20px}.profile{display:none}.welcome{padding:20px}.welcome h2{font-size:20px}.quick{grid-template-columns:1fr}}

/* Mobile layout improvements */
html, body { min-height:100%; width:100%; overflow-x:hidden; }
button, input, select, textarea { font:inherit; }
@media (max-width:600px) {
  .layout { display:block; min-height:100vh; }
  .sidebar {
    position:fixed; inset:auto 0 0 0; z-index:1000;
    width:100%; height:72px; padding:6px 5px;
    display:flex; align-items:center; justify-content:space-around;
    background:#0a1525; border-right:0; border-top:1px solid var(--line);
  }
  .brand, .nav-label, .side-note { display:none !important; }
  .sidebar .nav {
    display:flex; flex:1; align-items:center; justify-content:space-around;
    min-width:0; height:100%;
  }
  .nav button {
    display:flex; flex:1; min-width:0; width:auto; height:58px;
    flex-direction:column; justify-content:center; align-items:center;
    gap:4px; margin:0; padding:5px 2px; border-radius:9px;
    font-size:10px; text-align:center;
  }
  .nav button b { font-size:18px; line-height:20px; }
  .nav button span { display:block !important; font-size:9px; line-height:11px; }
  main {
    margin:0 !important; width:100% !important; max-width:none;
    padding:18px 14px 94px !important;
  }
  .topbar { margin-bottom:18px; }
  .topbar h1 { font-size:20px; }
  .eyebrow { font-size:9px; letter-spacing:1.2px; }
  .welcome { padding:18px; gap:10px; }
  .welcome h2 { font-size:19px; line-height:1.3; }
  .welcome p { font-size:13px; }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .card { padding:13px; min-width:0; }
  .stat-value { font-size:22px; }
  .grid, .quick { grid-template-columns:1fr; }
  .panel { padding:16px; }
  .chat-input { gap:6px; }
  .chat-input .btn { padding:10px 12px; }
  .field { min-width:0; font-size:16px; }
  .status-row { gap:10px; font-size:12px; }
  .status-row > * { overflow-wrap:anywhere; }
  .ticket { flex-wrap:wrap; }
}
@media (max-width:360px) {
  main { padding-left:10px !important; padding-right:10px !important; }
  .nav button span { font-size:8px; }
  .stats { gap:7px; }
  .card { padding:10px; }
}

</style>
</head>
